name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# hisaishi imports `@limccn/menhir-core` as `workspace:*`, so CI assembles the
# workspace: the sibling menhir repo plus this one.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/hisaishi
      - uses: actions/checkout@v4
        with:
          repository: limccn/menhir
          token: ${{ secrets.MENHIR_REPO_TOKEN || github.token }}
          path: workspace/menhir
      - name: Checkout longstone lockfile ledger
        uses: actions/checkout@v4
        with:
          repository: limccn/longstone
          token: ${{ github.token }}
          path: ci

      - name: Assemble workspace
        working-directory: workspace
        run: |
          # pnpm 12 hard-fails on unapproved build scripts (ERR_PNPM_IGNORED_BUILDS).
          # These three are required by the toolchain: esbuild by the bundlers,
          # sharp and workerd by miniflare/wrangler.
          printf 'packages:\n  - "menhir/ts"\n  - "hisaishi"\nallowBuilds:\n  "esbuild": true\n  "sharp": true\n  "workerd": true\n' > pnpm-workspace.yaml
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: workspace/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The lockfile is the reviewed ledger in longstone/ci/lockfiles. A
      # missing or stale ledger fails the job; there is no non-frozen fallback.
      - name: Install from reviewed lockfile
        working-directory: workspace
        run: |
          cp ../ci/ci/lockfiles/hisaishi-ci.yaml pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - run: pnpm --filter @limccn/menhir-core build
        working-directory: workspace

      # Includes the D1 + KV parity harness (miniflare) and the workerd smoke,
      # which rebuilds the real wrangler bundle before running.
      - run: pnpm --filter @limccn/hisaishi-gateway build
        working-directory: workspace
      - run: pnpm --filter @limccn/hisaishi-gateway test
        working-directory: workspace
      - run: pnpm --filter @limccn/hisaishi-gateway typecheck
        working-directory: workspace
